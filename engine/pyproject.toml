[project]
name = "recpro-engine"
version = "0.1.0"
description = "RecPro local AI engine: indexing, faces, search and safe file operations. Runs only on 127.0.0.1."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pillow>=11.0",
  "pillow-heif>=0.18",
  "blake3>=0.4",
  "watchdog>=4.0",
  "send2trash>=1.8",
  "scipy>=1.13",
  "onnxruntime-gpu>=1.31.1",
  "opencv-python-headless>=5.0.0.93",
  "scikit-learn>=1.9.1",
  "tokenizers>=0.23.3",
  "argon2-cffi>=25.1.0",
  "pynacl>=1.6.2",
  "python-multipart>=0.0.33",
  "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "scikit-image>=0.26.0",
]
# NVIDIA CUDA 13 + cuDNN 9 for development (1.7 GB). The installed app doesn't carry them: it
# downloads the same wheels once as its "GPU acceleration" pack (ml/models.py, GPU_WHEELS).
cuda = [
    "onnxruntime-gpu[cuda,cudnn]>=1.31.1",
]
build = [
    "pyinstaller>=6.10",
]

[tool.uv]
default-groups = ["dev", "cuda"]
# faster-whisper asks for the CPU onnxruntime, which would overwrite onnxruntime-gpu (both install the
# "onnxruntime" module); onnxruntime-gpu runs its voice detection just as well, so drop the request
override-dependencies = ["onnxruntime ; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recpro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
